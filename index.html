<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Orbitvo Tools 本地优先的图片裁剪、缩放、压缩与格式转换工具。">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://img.orbitvo.com/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="图片发布工具 · Orbitvo Tools">
  <meta property="og:description" content="本地优先的图片裁剪、缩放、压缩、转换与批量导出工具。">
  <meta property="og:url" content="https://img.orbitvo.com/">
  <meta name="theme-color" content="#5267e8">
  <title>图片发布工具 · Orbitvo Tools</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    html,body{margin:0;min-width:320px;background:#f6f7fb;color:#182033}
    @media (prefers-color-scheme:dark){html,body{background:#111521;color:#edf1fa}}
    .hidden{display:none!important}
    #upload{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:24px;background:inherit}
    body:has(#upload:not(.hidden)) .shell{visibility:hidden;pointer-events:none}
  </style>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="https://orbitvo.com" aria-label="返回 Orbitvo"><span>Orbitvo</span><span class="brand-mark">Tools / Image</span></a>
      <span id="image-info" class="hint" aria-live="polite"></span>
      <div class="topbar-actions">
        <button id="undo" class="button small" disabled aria-label="撤销">↶ 撤销</button>
        <button id="redo" class="button small" disabled aria-label="重做">↷ 重做</button>
        <button id="replace" class="button small">更换</button>
        <button id="export" class="button primary small">导出图片</button>
      </div>
    </header>
    <section class="workspace" aria-label="图片工作台">
      <div class="canvas-stage" id="stage"><div class="canvas-wrap"><canvas id="canvas" aria-label="图片预览。默认适应窗口；滚轮缩放，拖动平移，双击恢复适应。"></canvas><div id="crop-overlay" class="crop-overlay hidden" aria-label="拖动裁剪区域调整取景"><div id="crop-box" class="crop-box"><span class="crop-handle nw" data-handle="nw"></span><span class="crop-handle ne" data-handle="ne"></span><span class="crop-handle sw" data-handle="sw"></span><span class="crop-handle se" data-handle="se"></span></div></div></div></div>
      <aside class="panel" aria-label="编辑设置">
        <section class="section">
          <div class="section-head"><h2>尺寸</h2><label class="check" title="锁定宽高比"><input id="lock-ratio" type="checkbox" checked><span>锁定比例</span></label></div>
          <div class="field-row compact"><label class="field">宽<input id="width" type="number" min="1" inputmode="numeric"></label><label class="field">高<input id="height" type="number" min="1" inputmode="numeric"></label></div>
          <div class="button-row tight"><button type="button" class="button small" data-scale="1080">长边 1080</button><button type="button" class="button small" data-scale="1920">长边 1920</button></div>
          <div class="inline-row"><label class="field grow">裁剪<select id="crop-ratio"><option value="free">不裁剪</option><option value="1">1 : 1</option><option value="1.333333">4 : 3</option><option value="1.777778">16 : 9</option><option value=".5625">9 : 16</option></select></label><button type="button" id="edit-crop" class="button small">调整</button></div>
          <div class="button-row tight"><button type="button" id="rotate-left" class="button small">↺ 左转</button><button type="button" id="rotate-right" class="button small">右转 ↻</button><button type="button" id="flip" class="button small">↔ 镜像</button></div>
        </section>
        <section class="section">
          <h2>导出</h2>
          <div class="inline-row"><label class="field grow">格式<select id="format"><option value="image/jpeg">JPEG</option><option value="image/webp">WebP</option><option value="image/png">PNG</option></select></label><label class="field grow">压缩<select id="compress-mode"><option value="quality">按质量</option><option value="size">按大小</option></select></label></div>
          <label class="field" id="quality-field">质量 <span class="range-line"><input id="quality" type="range" min="40" max="100" value="82"><output id="quality-value">82</output>%</span></label>
          <div id="size-field" class="hidden">
            <label class="field">目标 <span class="range-line"><input id="target-size" type="range" min="50" max="2000" step="10" value="200"><output id="target-size-value">200</output> KB</span></label>
            <div class="button-row tight presets" id="size-presets"><button type="button" class="button small" data-kb="100">100</button><button type="button" class="button small" data-kb="200">200</button><button type="button" class="button small" data-kb="500">500</button><button type="button" class="button small" data-kb="1024">1MB</button></div>
          </div>
          <div class="inline-row" id="background-field"><span class="muted-label">JPEG 背景</span><input id="background" type="color" value="#ffffff" aria-label="JPEG 背景色"></div>
          <p id="export-estimate" class="hint tight">调整后会估算大小</p>
        </section>
        <section class="section last">
          <h2>批量</h2>
          <div class="button-row tight"><button type="button" id="add-batch" class="button small">添加</button><button type="button" id="export-batch" class="button small primary">逐张导出</button><button type="button" id="export-zip" class="button small">ZIP</button></div>
          <div id="queue" class="queue" aria-live="polite"></div>
        </section>
      </aside>
    </section>
    <footer class="footer"><span>Orbitvo Tools · 图片不默认上传</span><div class="footer-actions"><button type="button" id="ai-info" class="button small">关于 AI</button><button type="button" id="privacy" class="button small">隐私说明</button></div></footer>
  </main>
  <section id="upload" class="upload" aria-label="导入图片"><div id="dropzone" class="upload-card" tabindex="0" role="button" aria-label="选择或拖放图片"><div class="upload-icon">↥</div><h1>图片发布工具</h1><p>裁剪、缩放、压到指定 KB、格式转换与批量压缩。<br>拖入图片，点击选择，或直接粘贴截图。</p><button id="choose" class="button primary">选择图片</button><div class="privacy-badge">✓ 本地处理默认不上传</div></div></section>
  <input id="file-input" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
  <div id="dialog-backdrop" class="dialog-backdrop" role="presentation"><section id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"></section></div><div id="toasts" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').then(reg => reg.update()).catch(() => {});
    }
  </script>
</body>
</html>
