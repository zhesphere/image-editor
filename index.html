<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Orbitvo Tools 本地优先的图片裁剪、缩放、压缩与格式转换工具。">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://img.orbitvo.com/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="图片发布工具 · Orbitvo Tools">
  <meta property="og:description" content="本地优先的图片裁剪、缩放、压缩、转换与批量导出工具。">
  <meta property="og:url" content="https://img.orbitvo.com/">
  <meta name="theme-color" content="#5267e8">
  <title>图片发布工具 · Orbitvo Tools</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="https://orbitvo.com" aria-label="返回 Orbitvo"><span>Orbitvo</span><span class="brand-mark">Tools / Image</span></a>
      <span id="image-info" class="hint" aria-live="polite"></span>
      <div class="topbar-actions">
        <button id="undo" class="button small" disabled aria-label="撤销">↶ 撤销</button>
        <button id="redo" class="button small" disabled aria-label="重做">↷ 重做</button>
        <button id="replace" class="button small">更换</button>
        <button id="export" class="button primary small">导出图片</button>
      </div>
    </header>
    <section class="workspace" aria-label="图片工作台">
      <div class="canvas-stage" id="stage"><div class="canvas-wrap"><canvas id="canvas" aria-label="图片预览。可用鼠标滚轮或双指缩放，拖动平移。"></canvas></div></div>
      <aside class="panel" aria-label="编辑设置">
        <section class="section"><h2>发布处理</h2><p class="hint">先确定尺寸，再选择格式和质量。修改只在你点击应用时写入历史。</p><h3>尺寸与方向</h3>
          <div class="field-row"><label class="field">宽度（px）<input id="width" type="number" min="1" inputmode="numeric"></label><label class="field">高度（px）<input id="height" type="number" min="1" inputmode="numeric"></label></div>
          <label class="field"><span><input id="lock-ratio" type="checkbox" checked> 锁定比例</span></label><div class="button-row"><button class="button" data-scale="1080">长边 1080</button><button class="button" data-scale="1920">长边 1920</button></div>
          <label class="field">居中裁剪比例<select id="crop-ratio"><option value="free">不裁剪</option><option value="1">1 : 1</option><option value="1.333333">4 : 3</option><option value="1.777778">16 : 9</option><option value=".5625">9 : 16</option></select></label>
          <div class="button-row" style="margin-top:8px"><button id="rotate-left" class="button">↺ 左转</button><button id="rotate-right" class="button">右转 ↻</button><button id="flip" class="button">↔ 镜像</button></div><button id="apply-size" class="button primary" style="width:100%;margin-top:10px">应用尺寸与方向</button>
        </section>
        <section class="section"><h2>导出设置</h2><label class="field">格式<select id="format"><option value="image/jpeg">JPEG · 通用照片</option><option value="image/webp">WebP · 更小体积</option><option value="image/png">PNG · 透明/无损</option></select></label><label class="field" id="quality-field">质量 <span><input id="quality" type="range" min="40" max="100" value="82"><output id="quality-value">82</output>%</span></label><label class="field" id="background-field">JPEG 背景色<input id="background" type="color" value="#ffffff"></label><p id="export-estimate" class="hint">导出后会显示实际文件大小。</p></section>
        <section class="section"><h2>批量导出</h2><p class="hint">队列沿用当前导出格式、质量和尺寸规则；图片只在本机浏览器中处理。</p><div class="button-row"><button id="add-batch" class="button">添加图片</button><button id="export-batch" class="button primary">逐张导出</button></div><div id="queue" class="queue" aria-live="polite" style="margin-top:10px"></div></section>
        <section class="section"><h2>可选云端 AI</h2><p class="hint">豆包适合生成式清晰化与复杂遮挡修复，但它不是本地处理。首发不默认发送你的图片。</p><button id="ai-info" class="button">查看 AI 使用方式</button></section>
      </aside>
    </section>
    <footer class="footer"><span>Orbitvo Tools · 图片不默认上传，不保存原图。</span><button id="privacy" class="button small">隐私说明</button></footer>
  </main>
  <section id="upload" class="upload" aria-label="导入图片"><div id="dropzone" class="upload-card" tabindex="0" role="button" aria-label="选择或拖放图片"><div class="upload-icon">↥</div><h1>图片发布工具</h1><p>裁剪、缩放、压缩、格式转换与批量导出。<br>拖入图片，点击选择，或直接粘贴截图。</p><button id="choose" class="button primary">选择图片</button><div class="privacy-badge">✓ 本地处理默认不上传</div></div></section>
  <input id="file-input" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
  <div id="dialog-backdrop" class="dialog-backdrop" role="presentation"><section id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"></section></div><div id="toasts" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="app.js"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});</script>
</body>
</html>
