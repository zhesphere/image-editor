<!doctype html>
<html lang="zh-CN">
<head>
  <script>(()=>{try{const s=localStorage.getItem('orbitvo-theme');const d=s==='dark'||(s!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';document.documentElement.style.colorScheme=d?'dark':'light';}catch(e){}})();</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>图片转 PDF · Orbitvo Tools</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
  <div class="site">
    <header class="topbar">
      <a class="brand" href="./index.html"><span>Orbitvo</span><span class="brand-mark">Tools</span></a>
      <nav class="nav-tools" id="nav-tools"></nav>
      <div class="topbar-actions"><button type="button" id="download" class="button primary small" disabled>下载 PDF</button></div>
    </header>
    <section class="tool-page">
      <div class="stage" id="stage">
        <div id="empty" class="dropzone" tabindex="0" role="button">
          <h2>图片转 PDF</h2>
          <p>多张图片按顺序合成一个 PDF，全部在本机完成。</p>
          <button type="button" class="button primary" id="choose">选择图片</button>
        </div>
        <div id="preview-wrap" class="preview-frame hidden"><img id="preview" alt="预览"></div>
      </div>
      <aside class="panel">
        <section class="section">
          <h2>页面</h2>
          <label class="field">纸张
            <select id="page-size">
              <option value="a4">A4</option>
              <option value="letter">Letter</option>
              <option value="fit">跟图片尺寸</option>
            </select>
          </label>
          <label class="field">方向
            <select id="orient">
              <option value="auto">自动</option>
              <option value="portrait">纵向</option>
              <option value="landscape">横向</option>
            </select>
          </label>
          <label class="field">边距（pt）<input id="margin" type="number" min="0" max="72" value="24"></label>
          <button type="button" id="build" class="button primary block" disabled>生成 PDF</button>
        </section>
        <section class="section">
          <h2>图片顺序</h2>
          <div id="list" class="thumb-list"><p class="hint">尚未添加。</p></div>
        </section>
      </aside>
    </section>
    <footer class="footer"><span>pdf-lib 本地生成</span><a class="button small" href="./privacy.html">隐私</a></footer>
  </div>
  <input id="file-input" type="file" accept="image/*" multiple hidden>
  <div id="toasts" class="toast-region" aria-live="polite"></div>
  <script type="module" src="./images-to-pdf.js"></script>
</body>
</html>
