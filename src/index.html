<!doctype html>
<html lang="zh-CN">
<head>
  <script>(()=>{try{const s=localStorage.getItem('orbitvo-theme');const d=s==='dark'||(s!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';document.documentElement.style.colorScheme=d?'dark':'light';}catch(e){}})();</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Orbitvo 本地图片工具：压缩、合并、PDF 转图片、图片转 PDF，文件不上传。">
  <link rel="canonical" href="https://img.orbitvo.com/">
  <meta name="theme-color" content="#2f5bff">
  <title>Orbitvo Tools · 本地图片工具</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
  <div class="site">
    <header class="topbar">
      <a class="brand" href="https://orbitvo.com"><span>Orbitvo</span><span class="brand-mark">Tools</span></a>
      <nav class="nav-tools" id="nav-tools" aria-label="工具"></nav>
      <div class="topbar-actions"><a class="button small" href="./privacy.html">隐私</a></div>
    </header>
    <main class="hub">
      <section class="hub-claim">
        <h1>本地图片工具台</h1>
        <p>压缩到指定 KB、多图拼接、PDF 与图片互转。全部在浏览器内完成，默认不上传服务器。</p>
        <div class="privacy-chip">✓ 本地处理 · 不保存原图</div>
      </section>
      <section class="tool-grid" id="tool-grid" aria-label="工具列表"></section>
    </main>
    <footer class="footer">
      <span>Orbitvo Tools · img.orbitvo.com</span>
      <div class="footer-actions"><a class="button small" href="./privacy.html">隐私说明</a></div>
    </footer>
  </div>
  <script type="module" src="./home.js"></script>
</body>
</html>
