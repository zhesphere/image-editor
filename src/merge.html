<!doctype html>
<html lang="zh-CN">
<head>
  <script>(()=>{try{const s=localStorage.getItem('orbitvo-theme');const d=s==='dark'||(s!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';document.documentElement.style.colorScheme=d?'dark':'light';}catch(e){}})();</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>图片合并 · Orbitvo Tools</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
  <div class="site">
    <header class="topbar">
      <a class="brand" href="./index.html"><span>Orbitvo</span><span class="brand-mark">Tools</span></a>
      <nav class="nav-tools" id="nav-tools"></nav>
      <div class="topbar-actions"><button type="button" id="download" class="button primary small" disabled>下载合并图</button></div>
    </header>
    <section class="tool-page">
      <div class="stage" id="stage">
        <div id="empty" class="dropzone" tabindex="0" role="button">
          <h2>图片合并</h2>
          <p>把多张图拼成一张。支持横排、竖排与网格。</p>
          <button type="button" class="button primary" id="choose">选择图片</button>
        </div>
        <div id="preview-wrap" class="preview-frame hidden"><canvas id="preview"></canvas></div>
      </div>
      <aside class="panel">
        <section class="section">
          <h2>布局</h2>
          <label class="field">方向
            <select id="layout">
              <option value="vertical">竖向拼接</option>
              <option value="horizontal">横向拼接</option>
              <option value="grid">网格</option>
            </select>
          </label>
          <label class="field hidden" id="cols-field">列数
            <input id="cols" type="number" min="2" max="8" value="2">
          </label>
          <label class="field">间距（px）<input id="gap" type="number" min="0" max="80" value="8"></label>
          <label class="field">背景色<input id="bg" type="color" value="#ffffff"></label>
          <label class="field">输出格式
            <select id="format">
              <option value="image/png">PNG</option>
              <option value="image/jpeg">JPEG</option>
              <option value="image/webp">WebP</option>
            </select>
          </label>
          <button type="button" id="render" class="button primary block" disabled>生成预览</button>
        </section>
        <section class="section">
          <h2>图片顺序</h2>
          <div id="list" class="thumb-list"><p class="hint">尚未添加。</p></div>
        </section>
      </aside>
    </section>
    <footer class="footer"><span>仅在本机浏览器处理</span><a class="button small" href="./privacy.html">隐私</a></footer>
  </div>
  <input id="file-input" type="file" accept="image/*" multiple hidden>
  <div id="toasts" class="toast-region" aria-live="polite"></div>
  <script type="module" src="./merge.js"></script>
</body>
</html>
